<!DOCTYPE html>
{% load static %}
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="{% static 'css/index.css' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>ChopURL</title>
    </head>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <body>

        <section class="hero">
            <img src="{% static 'images/logo.jpg' %}" alt="ChopURL Logo" class="logo">
            <h1>ChopURL</h1>
            <p class="tagline">Shorten, customize, and share short URLs with your brand.</p>
        </section>
        
        <div class="d-flex justify-content-center my-4 w-100">
            <button type="button" class="btn btn-secondary" style="font-size: 1.5rem; padding: 1rem 2rem;" data-bs-toggle="modal" data-bs-target="#formModal">
                Create your URL!
            </button>
        </div>
    
        <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="formModalLabel">Create your URL</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                            <label for="url" class="form-label">Enter your URL:</label>
                            <input type="url" class="form-control" name="url" required>
                            </div>
                            <div class="mb-3">
                            <label for="custom_domain" class="form-label">Enter custom domain (only available with ChopURL):</label>
                            <input type="text" class="form-control" name="custom_domain" placeholder="e.g., mybrand.com">
                            </div>
                            <div class="mb-3">
                            <label for="chopurl_option" class="form-label">Select the service:</label>
                            <select class="form-select" name="chopurl_option" id="chopurl_option">
                                <option value="chopservice">ChopURL</option>
                                <option value="pyservice">TinyURL</option>
                            </select>
                            </div>
                            <button type="submit" class="btn btn-success">Chop URL!</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    
        <section class="features">
            <h2>Features</h2>
            <ul>
                <li>Shorten URLs with your brand.</li>
                <li>Customizable short links.</li>
                <li>Easy to use and share.</li>
            </ul>
        </section>

        <footer class="footer">
            <p>&copy; 2025 ChopURL. All rights reserved.</p>
        </footer>
  
    </body>
</html>
