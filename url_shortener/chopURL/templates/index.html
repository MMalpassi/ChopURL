<!DOCTYPE html>
{% load static %}
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="{% static 'css/index.css' %}">
        <title>ChopURL</title>
    </head>
    <body>
        <h1>Welcome to ChopURL!</h1>
        <div class="main-container">
            <div class="description">
                <h2>Shorten, customize, and share short URLs with your brand.</h2>
            </div>
    
            <form method="POST">
                {% csrf_token %}
                <label for="url">Enter your URL:</label>
                <input type="url" name="url" required>

                <label for="custom_domain">Enter custom domain (optional and only available with ChopURL service):</label>
                <input type="text" name="custom_domain" placeholder="e.g., mybrand.com">
    
                <label for="chopurl_option">Select the service:</label>
                <select name="chopurl_option" id="chopurl_option">
                    <option value="chopservice">ChopURL</option>
                    <option value="pyservice">TinyURL</option>
                </select>
    
                <button type="submit">Chop URL!</button>
            </form>
        </div>
    </body>
</html>
